<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base id="content-base" href="about:blank">
  <style>
    :root {
      color-scheme: light dark;
      --background: #fff;
      --foreground: #202124;
      --link: #176b55;
      --surface-container-low: #f1f4f9;
      --surface-container-high: #e5e8ee;
      --on-surface-variant: #414750;
      --outline-variant: #c1c7d2;
      --outline: #727780;
      --primary: #176b55;
      --secondary-container: #d3e8e0;
      --on-secondary-container: #0a3d30;
      --avatar-background: #dfe8f5;
      --avatar-foreground: #176b55;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #171717;
        --foreground: #e8e8e8;
        --link: #8fd9bc;
        --surface-container-low: #242424;
        --surface-container-high: #2f2f2f;
        --on-surface-variant: #c7c7c7;
        --outline-variant: #4a4a4a;
        --outline: #8e9094;
        --primary: #8fd9bc;
        --secondary-container: #2a473d;
        --on-secondary-container: #b6ead6;
        --avatar-background: #34443f;
        --avatar-foreground: #b6ead6;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
      color: var(--foreground);
      overflow-wrap: anywhere;
    }

    body {
      margin: 0;
      padding: 16px;
      font: 17px/1.75 system-ui, sans-serif;
      letter-spacing: 0;
    }

    #author-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      margin: 0 0 16px;
      padding: 10px 16px; /* 适当增加横向内边距，更舒展 */

      /* 1. 移除硬边框 */
      border: none;

      /* 2. M3 规范卡片圆角：推荐 16px (Shape.corner.large) */
      border-radius: 16px;

      /* 3. 使用 M3 填充色 */
      background: var(--surface-container-low);

      /* 4. M3 Filled Card 默认不加重阴影（Elevation 0），若需保留层次可用极淡的环境光 */
      box-shadow: none;
    }

    #author-bar[hidden] {
      display: none;
    }

    #author-avatar,
    #author-fallback {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 50%;
    }

    #author-avatar[hidden],
    #author-fallback[hidden] {
      display: none;
    }

    #author-avatar {
      object-fit: cover;
      background: var(--avatar-background);
    }

    #author-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--avatar-background);
      color: var(--avatar-foreground);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
    }

    #author-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    #author-name {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      color: var(--foreground);
      font-size: 16px;
      font-weight: 600;
      line-height: 22px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #author-level {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 64px;
      width: 64px;
      height: 24px;
      padding: 0 8px;
      border-radius: 6px;
      background: var(--avatar-background);
      color: var(--avatar-foreground);
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      white-space: nowrap;
    }

    #author-level[hidden] {
      display: none;
    }

    #content {
      min-width: 0;
    }

    p {
      margin: 0 0 1em;
    }

    a {
      color: var(--link);
    }

    #content img {
      max-width: 100% !important;
      height: auto !important;
    }

    video,
    iframe {
      max-width: 100% !important;
    }

    figure {
      margin: 1em 0;
    }

    pre,
    .table-scroll {
      max-width: 100%;
      overflow-x: auto;
    }

    pre {
      white-space: pre;
      font-size: 14px;
    }

    table {
      border-collapse: collapse;
    }

    td,
    th {
      border: 1px solid currentColor;
      padding: 6px 10px;
    }

    blockquote {
      margin: 1em 0;
      padding-left: 16px;
      border-left: 3px solid var(--link);
    }

    /* Media cards use the host palette directly, with aliases for older hosts. */
    .yingdi-video,
    .yingdi-card.steam {
      display: block;
      min-width: 0;
      margin: 1.25em 0;
      overflow: hidden;
      border-radius: 16px;
      background: var(--surface-container-low);
      color: var(--foreground);
    }

    .yingdi-video .video-frame {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: var(--surface-container-high);
    }

    .yingdi-video .video-frame > iframe,
    .yingdi-video .video-frame > video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      min-width: 0;
      border: 0;
      object-fit: contain;
    }

    .yingdi-video .video-frame > [hidden],
    .yingdi-video .video-caption [hidden] {
      display: none;
    }

    .yingdi-video .video-caption {
      padding: 14px 16px 16px;
      background: var(--md-sys-color-primary-container, var(--avatar-background));
      color: var(--md-sys-color-on-primary-container, var(--avatar-foreground));
    }

    .yingdi-video .video-source {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 28px;
      font-size: 12px;
      line-height: 20px;
    }

    .yingdi-video .video-source-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      margin: -8px -8px -8px 0;
      border-radius: 50%;
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .yingdi-video .video-source-link svg,
    .yingdi-card.steam .wish svg {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      fill: currentColor;
    }

    .yingdi-video .video-title {
      margin: 8px 0 0;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .yingdi-video .video-fallback {
      max-width: 100%;
      padding: 16px;
      color: var(--on-surface-variant);
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    .yingdi-video .video-fallback-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      margin-top: 8px;
      padding: 0 16px;
      border-radius: 24px;
      color: var(--primary);
      text-decoration: none;
    }

    .yingdi-card.steam .card-thumbnail {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 460 / 215;
      overflow: hidden;
      background: var(--surface-container-high);
    }

    #content .yingdi-card.steam .card-thumbnail img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      border-radius: 0;
      object-fit: contain;
    }

    #content .yingdi-card.steam .card-thumbnail img[hidden],
    .yingdi-card.steam .card-thumbnail-placeholder[hidden] {
      display: none;
    }

    .yingdi-card.steam .card-thumbnail-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: var(--on-surface-variant);
    }

    .yingdi-card.steam .card-thumbnail-placeholder svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
    }

    .yingdi-card.steam .steam-platform {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      background: var(--md-sys-color-tertiary-container, var(--secondary-container));
      color: var(--md-sys-color-on-tertiary-container, var(--on-secondary-container));
      font-size: 12px;
      font-weight: 500;
      line-height: 20px;
    }

    .yingdi-card.steam .card-info {
      min-width: 0;
      padding: 16px;
    }

    .yingdi-card.steam .title {
      display: block;
      margin: 0 0 12px;
      color: var(--foreground);
      font-size: 20px;
      font-weight: 500;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .yingdi-card.steam .card-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      min-width: 0;
    }

    .yingdi-card.steam .price {
      min-width: 0;
      color: var(--on-surface-variant);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .yingdi-card.steam .wish {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      max-width: 100%;
      margin-left: auto;
      padding: 8px 18px;
      border-radius: 24px;
      background: var(--primary);
      color: var(--md-sys-color-on-primary, var(--background));
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .yingdi-card.steam .wish[aria-disabled="true"] {
      background: var(--surface-container-high);
      color: var(--on-surface-variant);
    }

    .yingdi-video a:focus-visible,
    .yingdi-card.steam .wish:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .yingdi-video .video-source-link:focus-visible {
      outline-color: currentColor;
      outline-offset: -4px;
    }

    @media (hover: hover) and (pointer: fine) {
      .yingdi-video .video-source-link:hover,
      .yingdi-video .video-fallback-link:hover {
        background: color-mix(in srgb, currentColor 8%, transparent);
      }

      .yingdi-card.steam a.wish:hover {
        background: color-mix(in srgb, var(--md-sys-color-on-primary, var(--background)) 8%, var(--primary));
      }
    }

    .yingdi-video .video-source-link:active,
    .yingdi-video .video-fallback-link:active {
      background: color-mix(in srgb, currentColor 12%, transparent);
    }

    .yingdi-card.steam a.wish:active {
      background: color-mix(in srgb, var(--md-sys-color-on-primary, var(--background)) 12%, var(--primary));
    }

    /* Article link card: M3 filled card (16dp radius, surface-container-low, elevation 0). */
    .yingdi-card.bbspost {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 1.25em 0;
      padding: 12px;
      border-radius: 16px;
      background: var(--surface-container-low);
      color: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 150ms ease;
    }

    /* A card without a title cannot carry an accessible name; showing a bare thumbnail would be
       an unlabelled tap target, so it is dropped instead. */
    .yingdi-card.bbspost.no-title {
      display: none;
    }

    .yingdi-card.bbspost[role="link"] {
      cursor: pointer;
    }

    .yingdi-card.bbspost .card-thumbnail {
      display: block;
      flex: 0 0 96px;
      width: 96px;
      height: 72px;
      overflow: hidden;
      border-radius: 12px;
      background: var(--surface-container-high);
    }

    /* Both selectors are needed: the article's global rule sets max-width/height with !important. */
    #content .yingdi-card.bbspost .card-thumbnail img {
      display: block;
      width: 96px !important;
      height: 72px !important;
      max-width: none !important;
      max-height: none !important;
      margin: 0 !important;
      border-radius: 0;
      object-fit: cover;
    }

    /* `hidden` must beat the sized rule above, which carries an id for specificity. */
    #content .yingdi-card.bbspost .card-thumbnail img[hidden] {
      display: none;
    }

    .yingdi-card.bbspost .card-thumbnail-placeholder[hidden] {
      display: none;
    }

    .yingdi-card.bbspost .card-thumbnail-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: color-mix(in srgb, var(--on-surface-variant) 50%, transparent);
    }

    .yingdi-card.bbspost .card-thumbnail-placeholder svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    .yingdi-card.bbspost .card-info {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .yingdi-card.bbspost .card-info .title {
      display: -webkit-box;
      overflow: hidden;
      color: var(--foreground);
      font-size: 16px;
      font-weight: 600;
      line-height: 22px;
      overflow-wrap: anywhere;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .yingdi-card.bbspost .card-status {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: var(--on-surface-variant);
      font-size: 12px;
      font-weight: 400;
      line-height: 16px;
    }

    .yingdi-card.bbspost .card-status .author {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .yingdi-card.bbspost .card-status .time {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    /* The separator only exists when both halves are present, so a lone author or timestamp
       never trails a dot. */
    .yingdi-card.bbspost .card-status .author:not([hidden]) + .time:not([hidden])::before {
      content: "·";
      margin-right: 6px;
      color: color-mix(in srgb, var(--foreground) 38%, transparent);
    }

    .yingdi-card.bbspost .card-status .author[hidden],
    .yingdi-card.bbspost .card-status .time[hidden] {
      display: none;
    }

    .yingdi-card.bbspost:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* Hover only where a pointer can actually hover: on touch, :hover sticks after a tap. */
    @media (hover: hover) and (pointer: fine) {
      .yingdi-card.bbspost:hover {
        background: color-mix(in srgb, var(--foreground) 8%, var(--surface-container-low));
      }
    }

    .yingdi-card.bbspost:active {
      background: color-mix(in srgb, var(--foreground) 12%, var(--surface-container-low));
    }

    @media (max-width: 360px) {
      .yingdi-card.bbspost {
        gap: 10px;
        padding: 10px;
      }

      .yingdi-card.bbspost .card-thumbnail {
        flex-basis: 80px;
        width: 80px;
        height: 60px;
      }

      #content .yingdi-card.bbspost .card-thumbnail img {
        width: 80px !important;
        height: 60px !important;
      }
    }

    /* A tapped card keeps :focus on touch, which would repaint the hover state layer. */
    @media (hover: none) {
      .yingdi-card.bbspost:focus:not(:active) {
        background: var(--surface-container-low);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .yingdi-card.bbspost {
        transition: none;
      }
    }

    /* Deck card: M3 filled card (16dp radius, surface-container-low, elevation 0). */
    .yingdi-deck {
      display: block;
      margin: 1.25em 0;
      border-radius: 16px;
      background: var(--surface-container-low);
      overflow: hidden;
    }

    .yingdi-deck[hidden] {
      display: none;
    }

    .yingdi-deck .deck-image {
      display: block;
      line-height: 0;
      background: var(--outline-variant);
    }

    .yingdi-deck .deck-image[hidden] {
      display: none;
    }

    .yingdi-deck .deck-image img {
      display: block;
      width: 100% !important;
      height: auto !important;
      max-width: 100% !important;
      margin: 0;
    }

    /* The deck code is data only; never paint it, even if author CSS unhides it. */
    .yingdi-deck aside {
      display: none !important;
    }

    .yingdi-deck .deck-actions {
      display: flex;
      align-items: stretch;
      gap: 8px;
      padding: 12px 16px 16px;
    }

    .yingdi-deck .deck-actions[hidden] {
      display: none;
    }

    .yingdi-deck button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 0;
      height: 40px;
      margin: 0;
      padding: 0 16px;
      border: 0;
      border-radius: 20px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 150ms ease, box-shadow 150ms ease;
    }

    .yingdi-deck button[hidden] {
      display: none;
    }

    .yingdi-deck button svg {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      fill: currentColor;
    }

    /* Keyboard focus ring. Click focus is cleared in JS; the :focus rules below erase its state layer. */
    .yingdi-deck button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .yingdi-deck .deck-label {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .yingdi-deck .copy-code {
      flex: 1 1 0;
      background: var(--secondary-container);
      color: var(--on-secondary-container);
    }

    .yingdi-deck .copy-code:hover,
    .yingdi-deck .copy-code:active {
      background: color-mix(in srgb, var(--on-secondary-container) 8%, var(--secondary-container));
    }

    .yingdi-deck .deck-link {
      flex: 1 1 0;
      color: var(--primary);
      box-shadow: inset 0 0 0 1px var(--outline);
    }

    .yingdi-deck .deck-link:hover,
    .yingdi-deck .deck-link:active {
      background: color-mix(in srgb, var(--primary) 8%, transparent);
    }

    @media (max-width: 360px) {
      .yingdi-deck .deck-actions {
        justify-content: flex-end;
        padding: 12px;
      }

      .yingdi-deck button {
        flex: 0 0 40px;
        width: 40px;
        padding: 0;
      }

      .yingdi-deck .deck-label {
        display: none;
      }
    }

    /* If a tapped control ever stays focused, :focus would repaint the hover/pressed colour and
       the outline inset. Restore the idle look for unfocused-state parity. */
    @media (hover: none) {
      .yingdi-deck button:focus:not(:active) {
        background: transparent;
        box-shadow: none;
      }

      .yingdi-deck .copy-code:focus:not(:active) {
        background: var(--secondary-container);
      }

      .yingdi-deck .deck-link:focus:not(:active) {
        box-shadow: inset 0 0 0 1px var(--outline);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .yingdi-deck button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <section id="author-bar" hidden aria-label="作者信息">
    <img id="author-avatar" alt="" hidden>
    <span id="author-fallback" aria-hidden="true"></span>
    <div id="author-info">
      <div id="author-name"></div>
      <span id="author-level" hidden></span>
    </div>
  </section>
  <main id="content"></main>
  <!-- APP_WEB_BRIDGE -->
  <script>
    (() => {
      'use strict';
      const content = document.getElementById('content');
      const authorBar = document.getElementById('author-bar');
      const authorAvatar = document.getElementById('author-avatar');
      const authorFallback = document.getElementById('author-fallback');
      const authorName = document.getElementById('author-name');
      const authorLevel = document.getElementById('author-level');

      let current = null;
      let restoreTarget = null;
      let latestPosition = { scrollY: 0 };
      let viewport = '';
      let inputUntil = 0;
      let blocks = [];
      const blockIndex = new Map();
      let scrollFrame = 0;
      let renderFrame = 0;
      let authorGeneration = 0;

      // Material role names arrive as camelCase keys; CSS custom properties use kebab-case.
      const kebab = (name) => name.replace(/[A-Z]/g, (letter) => '-' + letter.toLowerCase());

      // Role properties written by the previous theme, so a palette change never leaves stale
      // colours behind on the root element.
      let roleProperties = [];

      const updateTheme = (theme) => {
        const root = document.documentElement;
        root.style.setProperty('--background', theme.background);
        root.style.setProperty('--foreground', theme.foreground);
        root.style.setProperty('--link', theme.link);

        // Publish the whole palette first so any rule (including future ones) can use the exact
        // M3 role. Older hosts send no `colors`; then every alias below falls back to color-mix.
        const roles = theme.colors && typeof theme.colors === 'object' ? theme.colors : {};
        roleProperties.forEach((property) => root.style.removeProperty(property));
        roleProperties = [];
        for (const [name, value] of Object.entries(roles)) {
          if (typeof value !== 'string' || !value) continue;
          const property = `--md-sys-color-${kebab(name)}`;
          root.style.setProperty(property, value);
          roleProperties.push(property);
        }
        const role = (name, fallback) =>
          typeof roles[name] === 'string' && roles[name] ? roles[name] : fallback;

        root.style.setProperty(
          '--surface-container-low',
          role('surfaceContainerLow', `color-mix(in srgb, ${theme.background} 92%, ${theme.foreground})`)
        );
        root.style.setProperty(
          '--surface-container-high',
          role('surfaceContainerHigh', `color-mix(in srgb, ${theme.background} 88%, ${theme.foreground})`)
        );
        root.style.setProperty(
          '--on-surface-variant',
          role('onSurfaceVariant', `color-mix(in srgb, ${theme.foreground} 72%, ${theme.background})`)
        );
        root.style.setProperty(
          '--outline-variant',
          role('outlineVariant', `color-mix(in srgb, ${theme.foreground} 24%, transparent)`)
        );
        root.style.setProperty(
          '--avatar-background',
          role('primaryContainer', `color-mix(in srgb, ${theme.link} 18%, ${theme.background})`)
        );
        root.style.setProperty('--avatar-foreground', role('onPrimaryContainer', theme.link));
        root.style.setProperty('--primary', role('primary', theme.link));
        root.style.setProperty(
          '--outline',
          role('outline', `color-mix(in srgb, ${theme.foreground} 50%, ${theme.background})`)

      const renderAuthor = (author) => {
        clearAuthor();
        if (!author || (!author.id && !author.username && !author.head)) return;
        const generation = authorGeneration;
        const username = typeof author.username === 'string' ? author.username.trim() : '';
        const displayName = username || '未知作者';

        authorBar.hidden = false;
        authorBar.dataset.authorId = String(author.id ?? 0);
        authorName.textContent = displayName;
        authorFallback.textContent = Array.from(username || '匿')[0] || '匿';

        if (Number.isInteger(author.level) && author.level >= 1 && author.level <= 100) {
          authorLevel.textContent = `Lv. ${author.level}`;
          authorLevel.setAttribute('aria-label', `等级 ${author.level}`);
          authorLevel.hidden = false;
        }

        const head = typeof author.head === 'string' ? author.head.trim() : '';
        if (!isSafeImageUrl(head)) return;
        authorAvatar.alt = displayName;
        authorAvatar.onload = () => {
          if (generation !== authorGeneration) return;
          authorAvatar.hidden = false;
          authorFallback.hidden = true;
        };
        authorAvatar.onerror = () => {
          if (generation !== authorGeneration) return;
          authorAvatar.removeAttribute('src');
          authorAvatar.hidden = true;
          authorFallback.hidden = false;
        };
        authorAvatar.src = head;
      };

      ['touchstart', 'touchmove', 'touchend', 'touchcancel', 'pointerdown', 'pointermove',
        'pointerup', 'pointercancel', 'wheel', 'keydown'].forEach((name) =>
        document.addEventListener(name, stopRestore, { passive: true })
      );

      const observer = new ResizeObserver(restore);

      const reset = () => {
        current = null;
        restoreTarget = null;
        document.documentElement.style.removeProperty('overflow-anchor');
        latestPosition = { scrollY: 0 };
        viewport = '';
        inputUntil = 0;
        blocks = [];
        blockIndex.clear();
        cancelAnimationFrame(scrollFrame);
        cancelAnimationFrame(renderFrame);
        observer.disconnect();
        content.querySelectorAll('video,audio').forEach((media) => media.pause());
        // A removed control keeps document.activeElement, so drop focus before replacing the body.
        if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
        content.replaceChildren();
        clearAuthor();
        window.scrollTo(0, 0);
      };

      // Deck buttons must not keep focus after a tap: Chromium keeps :focus on the control, which
      // repaints the state layer and leaves an active-looking card action behind.
      function releaseDeckFocus(element) {
        if (!(element instanceof Element)) return;
        const button = element.closest('.yingdi-deck button');
        if (button && !button.matches(':active')) button.blur();
      }

      content.addEventListener('click', (event) => {
        releaseDeckFocus(event.target);
        const focused = document.activeElement;
        if (focused instanceof Element && !focused.matches(':active')) releaseDeckFocus(focused);
      });

      const handleClick = (event, context) => {
        const target = event.target instanceof Element ? event.target : event.target.parentElement;

        if (handleDeckClick(event, target, context)) return;
        if (handleCardClick(event, target, context)) return;

        const image = target?.closest('img');
        if (image) {
          event.preventDefault();
          const images = articleImages();
          const index = images.indexOf(image);
          // Deck and card covers are decoration; they never open the gallery.
          if (index < 0) return;
          const urls = images.map(
            (img) => new URL(img.dataset.original || img.dataset.src || img.currentSrc || img.src, document.baseURI).href
          );
          const position = readPosition();
          context.emit('scroll', { position });
          context.emit('imageClick', { urls, index, position });
          return;
        }

        const anchor = target?.closest('a[href]');
        if (!anchor) return;
        event.preventDefault();

        const url = new URL(anchor.href, document.baseURI);
        const base = new URL(document.baseURI);
        const isSameDocumentAnchor =
          url.origin === base.origin &&
          url.pathname === base.pathname &&
          url.search === base.search &&
          url.hash;

        if (isSameDocumentAnchor) {
          stopRestore();
          document.getElementById(decodeURIComponent(url.hash.slice(1)))?.scrollIntoView();
        } else {
          context.emit('linkClick', { url: url.href });
        }
      };

      const handleKeydown = (event, context) => {
        if (event.key !== 'Enter') return;
        const target = event.target instanceof Element ? event.target : event.target.parentElement;
        const card = target?.closest('.yingdi-card.bbspost[role="link"][data-app-card="true"]');
        if (card) handleCardClick(event, card, context);
      };

      window.AppContentTemplate = {
        updateTheme,
        captureState: readPosition,
        reset,

        render(payload, context) {
          reset();
          current = context;
          document.getElementById('content-base').href = payload.baseUrl;
          updateTheme(payload.theme);
          renderAuthor(payload.templateData?.author);

          restoreTarget = normalizePosition(payload.position || { scrollY: payload.scrollY });
          document.documentElement.style.overflowAnchor = 'none';
          latestPosition = restoreTarget;
          content.innerHTML = payload.html;

          content.querySelectorAll('img').forEach((img) => {
            if (!img.getAttribute('src') && img.dataset.src) img.src = img.dataset.src;
          });

          prepareDecks();
          prepareCards();
          prepareVideos(context);
          prepareSteamCards(context);

          content.querySelectorAll('table').forEach((table) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'table-scroll';
            table.before(wrapper);
            wrapper.append(table);
          });

          indexBlocks();
          updateViewport();
          observer.observe(content);
          content.addEventListener('load', restore, { capture: true, signal: context.signal });
          content.addEventListener('error', restore, { capture: true, signal: context.signal });
          window.addEventListener('resize', restore, { passive: true, signal: context.signal });
          document.addEventListener('visibilitychange', () => {
            if (document.hidden) reportPosition();
          }, { signal: context.signal });
          window.addEventListener('pagehide', reportPosition, { signal: context.signal });
          document.fonts?.ready.then(() => { if (context.isCurrent()) restore(); });

          window.addEventListener(
            'scroll',
            () => {
              // Native/Compose inertia continues after the last DOM touch event.
              if (performance.now() < inputUntil) inputUntil = performance.now() + 250;
              cancelAnimationFrame(scrollFrame);
              scrollFrame = requestAnimationFrame(reportPosition);
            },
            { passive: true, signal: context.signal }
          );

          content.addEventListener('click', (event) => handleClick(event, context), {
            signal: context.signal,
          });
          content.addEventListener('keydown', (event) => handleKeydown(event, context), {
            signal: context.signal,
          });

          context.signal.addEventListener(
            'abort',
            () => {
              if (current === context) reset();
            },
            { once: true }
          );

          return new Promise((resolve) => {
            const finish = () => resolve();
            context.signal.addEventListener('abort', finish, { once: true });
            renderFrame = requestAnimationFrame(() => {
              context.signal.removeEventListener('abort', finish);
              if (context.isCurrent()) restore();
              resolve();
            });
          });
        },
      };
    })();
  </script>
</body>

</html>
